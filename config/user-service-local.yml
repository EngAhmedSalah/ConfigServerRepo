spring:
  application:
    name: user-service
  datasource:
    url: jdbc:mysql://localhost:3307/user_database
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  management:
    endpoints:
      web:
        exposure:
          include: "*"
    endpoint:
      health:
        show-details: always
      env:
        enabled: true
      refresh:
        enabled: true
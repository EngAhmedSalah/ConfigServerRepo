datasource:
  url: jdbc:mysql://production:3307/user_database
  driver-class-name: com.mysql.cj.jdbc.Driver
  username: root
  password: root

jpa:
  hibernate:
    ddl-auto: update
  show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://production:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true